# 插件使用的语言（默认为 en）。
language: zh_CN
options:
  general:

    # [整数] 单个队伍中允许的最大玩家数量。（不包括队长）
    maxPartySize: 4

    # [整数] 玩家再次使用 /island info 命令前的冷却时间（秒）。（注意：重载插件时冷却时间会重置）
    cooldownInfo: 20

    # [整数] 玩家再次使用 /island restart 命令前的冷却时间（秒）。
    cooldownRestart: 30

    # [整数] 玩家再次使用 /island biome 命令前的冷却时间（秒）。
    biomeChange: 60

    # [字符串] 分配给新岛屿的默认生物群系
    defaultBiome: ocean

    # [字符串] 分配给新下界岛屿的默认生物群系
    defaultNetherBiome: nether_wastes

    # [整数] 向玩家发送相同通知的间隔毫秒数。
    # 这在事件被频繁触发时使用——例如，防止拾取物品、防止伤害等。
    maxSpam: 2000

    # [字符串] 空岛世界的名称，如果不存在将自动生成。
    worldName: skyworld

    # [整数] 围绕 0,0 坐标，不会创建岛屿以保护出生点的区域。
    spawnSize: 64
  island:

    # [整数] 岛屿生成的 Y 坐标（高度）。
    height: 150

    # [整数] 岛屿之间的方块距离。
    distance: 128

    # [整数] 每个岛屿的保护区域大小。不能高于 'distance'，
    # 并且如果你打算使用下界，必须能被 32 整除。
    protectionRange: 128

    # [文件名] 用于岛屿生成的蓝图。
    # 将你的蓝图放在 'uSkyBlock/schematics' 文件夹中，你不需要在下面添加 '.schematic' 部分。
    schematicName: default

    # [true/false] 如果为 true，当玩家传送回他们的岛屿时，移除所有敌对生物。
    removeCreaturesByTeleport: false

    # [物品列表] 玩家开始新岛屿时放置在箱子中的物品列表。物品ID:数量。
    # 默认是 2 个冰、1 个西瓜、1 个仙人掌、1 个岩浆桶、1 个红色和棕色蘑菇、1 个南瓜种子、1 个甘蔗、1 个木牌。
    chestItems:
    - ice:2
    - melon_slice:1
    - cactus:1
    - lava_bucket:1
    - red_mushroom:1
    - brown_mushroom:1
    - pumpkin_seeds:1
    - sugar_cane:1
    - oak_sign:1
    addExtraItems: true
    islandTeleportDelay: 2
    allowPvP: deny
    allowIslandLock: true
    useIslandLevel: true
    useTopTen: true
    topTenTimeout: 20
    autoRefreshScore: 0
    topTenShowMembers: true
    fixFlatland: false
    chat-format: '&9SKY &r{DISPLAYNAME} &f>&d {MESSAGE}'
    log-size: 10
    spawn-limits:
      enabled: true
      animals: 64
      monsters: 50
      villagers: 16
      golems: 5
    block-limits:
      enabled: true
      hopper: 50
      spawner: 10
    extraPermissions:
      smallbonus:
      - cobblestone:16
      - cooked_porkchop:5
      mediumbonus:
      - torch:16
      - lava_bucket:1
      largebonus:
      - dirt:5
      - sand:5
      giantbonus:
      - grass_block:1
      - mycelium:1
      extremebonus:
      - bone:8
      - coal:4
      donorbonus:
      - bow:1
      - arrow:32
      - stone_sword:1
      netheraccess:
      - obsidian:14
      - flint_and_steel:1
  extras:

    # [true/false] 如果为 true，将没有岛屿的玩家（包括在离线时被移出队伍的玩家）在登录时送回服务器出生点。
    # 注意：需要 EssentialsSpawn 或其他带有 "/spawn" 命令的插件
    sendToSpawn: false

    # [true/false] 如果为 true，玩家重生时将重生在他们的岛屿上。将首先尝试将他们重生在最靠近其岛屿家园的安全位置，然后是他们的岛屿出生点，最后是服务器出生点。
    # 注意：如果此项为 true，则忽略 sendToSpawn，除非玩家没有岛屿或没有可行的岛屿家园或出生点位置。
    respawnAtIsland: true

    # [true/false] 如果为 true，玩家可以在手持空桶的情况下右键点击其岛屿上的黑曜石方块，以移除黑曜石并将桶装满熔岩。这对于那些不小心
    # 因糟糕的刷石机设计而将其熔岩变成黑曜石的人很有用。仅在玩家的岛屿上且在附近没有其他黑曜石方块时有效（因此不能用于传送门）。
    obsidianToLava: true

  # 包含用于启用各种机制保护的标志。
  protection:

    # 掉落在地上的物品是否应仅限于队伍成员拾取。
    item-drops: true

    # 如果为 true，只有以队伍成员为目标的苦力怕才会爆炸
    creepers: true

    # 如果为 true，凋零将被限制为只能伤害岛屿成员/岛屿方块。
    withers: true

    # 插件是否会尝试保护玩家免于意外熄灭熔岩
    protect-lava: true

    # 是否应阻止传送到下界顶部。
    nether-roof: true

    # 是否允许在空岛中进行交易
    # 默认值：false - 因为这违背了空岛的核心玩法
    villager-trading-enabled: false

    # 针对破坏者的常规保护
    # 如果标志为 true，通常意味着保护处于激活状态
    # （即该操作被阻止）
    visitors:

      # 保护访客免于践踏你的农作物
      trampling: true

      # 防止访客攻击动物
      kill-animals: true

      # 防止访客攻击怪物
      kill-monsters: true

      # 防止剪羊毛
      shearing: true

      # 防止被投掷可孵化的鸡蛋轰炸
      hatching: true

      # 防止与村民交易
      villager-trading: true

      # 访客是否受到摔落伤害保护
      fall: true

      # 访客是否受到火焰伤害保护（包括熔岩）
      fire-damage: true

      # 访客是否受到怪物伤害保护
      monster-damage: false

      # 是否允许访客丢弃物品
      item-drops: true

      # 当有玩家访问岛屿时，警告在线成员。
      warn-on-warp: true

      # 是否主动阻止被封禁的玩家进入岛屿（通过行走/飞行）。
      block-banned-entry: true

      # 访客是否可以使用传送门（默认：false）
      use-portals: false

      # 访客是否可以骑乘载具
      vehicle-enter: false

      # 访客是否可以破坏载具
      vehicle-damage: false

  # 包含用于控制岛屿上怪物生成的标志。
  spawning:
    # 控制幻翼是否允许自然生成。非自然生成，例如来自刷怪蛋的生成，不
    # 由我们管理。
    phantoms:
      # [true/false] 主世界是否允许幻翼自然生成。true 启用幻翼生成。
      overworld: true
      # [true/false] 下界是否允许幻翼自然生成。true 启用幻翼生成。
      nether: false

  party:

    # 邀请超时前的毫秒数（1000 毫秒 = 1 秒）
    invite-timeout: 30000

    # /partytalk 聊天消息中使用的格式
    chat-format: '&9PARTY &r{DISPLAYNAME} &f>&b {MESSAGE}'

    # 当玩家加入岛屿时执行的额外命令
    join-commands:
    - op:playsound block.enderchest.open block @p

    # 当玩家离开岛屿时执行的额外命令
    leave-commands:
    - op:playsound block.enderchest.close block @p

  # 此部分提供了一些性能调优配置
  advanced:

    # 如果为 true，将查找显示名称（可能占用较多性能）。
    useDisplayNames: false

    # [数字] 清理岛屿的阈值。
    # 任何等级高于此值的岛屿将被豁免。
    purgeLevel: 10

    # [秒] 通过重新执行命令来确认命令的秒数
    # （/is leave, /is restart）。
    confirmTimeout: 10

    # [数字] 每个服务器刻重新生成的区块数量。可能根据可用的
    # 服务器资源减少或增加。默认值：4。
    chunkRegenSpeed: 4

    # 如果为 false，世界出生点将被忽略。你应该使用 /mv setspawn 设置世界出生点位置
    # 并管理出生点建筑。
    manageSpawn: true

    # 控制有关内部玩家数据库的高级行为
    playerdb:

      # 有效值为：yml, memory, bukkit
      storage: bukkit

  # 关于重置岛屿（或接受邀请）的部分。
  restart:

    # 在岛屿创建/重置时清除玩家的背包
    clearInventory: true

    # 在岛屿创建/重置时清除玩家的盔甲
    clearArmor: true

    # 在岛屿创建/重置时清除玩家的末影箱
    clearEnderChest: true

    # 清除玩家从奖励中获得的权限
    clearPerms: true

    # 清除用户的余额（设置为 0）
    clearCurrency: false

    # [毫秒] 在 /is restart 或 /is create 后将玩家传送回来之前等待的毫秒数
    # （默认：1000）
    teleportDelay: 1000

    # [true/false] 当岛屿准备好时，是否应自动将玩家传送到岛屿
    teleportWhenReady: true

    # 岛屿创建后执行的命令列表
    # 例如：
    # - me 高兴地跳了起来
    extra-commands: []

# 在此部分中，可以将额外的增益分配给权限节点
donor-perks:
  # 给予某人的权限节点
  'usb.donor.small':
    extraItems: [bone_meal:1]
    maxPartySize: 5
    animals: 84
    monsters: 60
    villagers: 20
    golems: 6
    # 经验加成 10%
    rewardBonus: 0.1
    # 饥饿值减少 10%
    hungerReduction: 0.1

# 是否显示创建/重置的 UI
island-schemes-enabled: true

# /is create 和 /is restart 的选项列表
# island-schemes 下的节点必须与 schematics 文件夹中的蓝图名称匹配。
island-schemes:

  # 蓝图名称
  default:

    # 使用此岛屿所需的权限
    permission: usb.island.create

    # 岛屿的简短描述
    description: 基础岛屿

    # 在 GUI 中显示的物品
    displayItem: oak_sapling

    # 可选，默认为 true（true 在 GUI 中启用，false 在 GUI 中禁用）
    enabled: true

    # 可选，必须按升序排列
    index: 2

    # 可选，每个岛屿可以给予的额外物品
    extraItems: ''
    maxPartySize: 4
    animals: 64
    monsters: 50
    villagers: 24
    golems: 5

    # 获得正常分数的 100%
    scoreMultiply: 1.0

    # 但不带任何偏移量开始
    scoreOffset: 0
  skySMP:
    permission: usb.schematic.skysmp
    description: 高级岛屿
    displayItem: oak_leaves
    enabled: false
    index: 3
    extraItems:
    - obsidian:14
    - flint_and_steel:1
    maxPartySize: 4
    animals: 64
    monsters: 50
    villagers: 24
    golems: 5
    scoreMultiply: 0.9
    scoreOffset: 40
  spawn:
    description: 默认的出生点蓝图
    enabled: false
confirmation:

  # [true/false] 是否需要确认（即重复输入两次命令）。
  is leave: true

  # [true/false] 是否需要确认（即重复输入两次命令）。
  is restart: true
asyncworldedit:

  # 支持禁用 AWE 的检测
  enabled: true

  # 每 5 秒向用户显示进度
  progressEveryMs: 5000

  # 或每 20%（以先到者为准）
  progressEveryPct: 20
  watchDog:

    # 等待 AWE 粘贴完成的最长时间（2m、3m20s 等）
    timeout: 15s

    # 每次心跳之间的毫秒数
    heartBeatMs: 2000
worldguard:
  entry-message: true
  exit-message: true
nether:
  enabled: true
  height: 75
  lava_level: 7
  activate-at:
    level: 100
  schematicName: uSkyBlockNether
  terraform-enabled: true

  # 搜索有效地形改造位置的距离。
  terraform-distance: 7

  # 在什么垂直视角范围内启用地形改造
  # -90 表示直视正上方
  # 90 表示直视正下方
  terraform-min-pitch: -70.0
  terraform-max-pitch: 90.0

  # 生成方块的概率
  terraform:
    NETHERRACK:
    - '{p=0.30}NETHERRACK'
    - '{p=0.15}NETHERRACK'
    - '{p=0.05}NETHER_QUARTZ_ORE'
    - '{p=0.05}SOUL_SAND'
    NETHER_QUARTZ_ORE:
    - '{p=0.30}NETHER_QUARTZ_ORE'
    - '{p=0.10}NETHER_QUARTZ_ORE'
    SOUL_SAND:
    - '{p=0.25}SOUL_SAND'
    - '{p=0.07}SOUL_SAND'
    - '{p=0.05}GRAVEL'
    GRAVEL:
    - '{p=0.15}GRAVEL'
    - '{p=0.05}GRAVEL'
    - '{p=0.05}SOUL_SAND'
    GLOWSTONE:
    - '{p=0.80}GLOWSTONE'
    - '{p=0.15}GLOWSTONE'

  # 根据使用的工具，应用于上述地形改造概率的权重
  terraform-weight:
    WOOD: 0
    STONE: 1.0
    IRON: 0.9
    GOLD: 1.5
    DIAMOND: 0.2
    NETHERITE: 1.2

  # 在下界砖块上生成时改变僵尸猪灵的概率
  spawn-chances:
    enabled: true
    wither: 0.2
    skeleton: 0.1
    blaze: 0.2
tool-menu:
  enabled: true
  tool: OAK_SAPLING
  commands:
    CHEST: island
    CRAFTING_TABLE: challenges
    BEDROCK: island spawn

plugin-updates:
  # 我们是否应该检查更新，并在有可用更新时记录一条消息
  check: true
  # 可能的选项：RELEASE 或 STAGING
  branch: RELEASE

# 占位符 - 启用这些以获取占位符替换
# usb_version
# usb_island_level, usb_island_level_int
# usb_island_rank, usb_island_partysize_max, usb_island_partysize
# usb_island_leader, usb_island_bans, usb_island_members, usb_island_trustees
# usb_island_biome, usb_island_schematic
# usb_island_location, usb_island_location_x, usb_island_location_y, usb_island_location_z
# usb_island_golems_max, usb_island_monsters_max, usb_island_animals_max, usb_island_villagers_max,
# usb_island_golems, usb_island_monsters, usb_island_animals, usb_island_villagers
placeholder:

  # 钩入 MVdWPlaceholderAPI
  mvdwplaceholderapi: false

  # 用于聊天消息和格式的 uSkyBlock 原生占位符
  chatplaceholder: false

  # 用于服务器命令的 uSkyBlock 原生占位符
  servercommandplaceholder: false

# 不要触碰下面的字段
version: 110
force-replace:
  options.party.invite-timeout: 100
  options.island.islandTeleportDelay: 5
  options.island.useOldIslands: false
  options.island.schematicName: yourschematichere
move-nodes:
  options.restart.confirmation: confirmation.is restart
  options.party.leave.confirmation: confirmation.is leave
  options.island.hopperlimit: options.island.block-limits.hopper
  options.island.spawnerlimit: options.island.block-limits.mob_spawner
  options.island.block-limits.mob_spawner: options.island.block-limits.spawner
