          xp: 15
        repeatReward:
          text: 4个沙子，2个绿色染料
          commands:
          - 'console: give {party} minecraft:sand 4'
          - 'console: give {party} minecraft:green_dye 2'
          currency: 5
          xp: 5

      mushroom_farm:
