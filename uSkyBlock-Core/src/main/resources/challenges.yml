# ======================================================================================================================
allowChallenges: true
challengeSharing: island
broadcastCompletion: true
broadcastText: '&6'
requirePreviousRank: true
rankLeeway: 8
defaultResetInHours: 20
radius: 10
repeatLimit: 0
challengeColor: '&e'
finishedColor: '&2'
repeatableColor: '&a'
enableEconomyPlugin: true
resetChallengesOnCreate: true
lockedDisplayItem: red_stained_glass_pane
ISLAND:
  lockedDisplayItem: blue_stained_glass_pane
ISLAND_LEVEL:
  lockedDisplayItem: black_stained_glass_pane
showLockedChallengeName: true

ranks:
  # ===============================================
  # 第一层：拓荒时代 - 从零开始到下界之门 (1.21.4)
  # 初始资源：橡树、2冰、1岩浆桶、西瓜种子、南瓜种子、红蘑菇、棕蘑菇、甘蔗、约60泥土、3沙子
  # ===============================================
  Tier1:
    name: '&a拓荒时代'
    displayItem: minecraft:grass_block
    resetInHours: 20
    challenges:
      # ===============================================
      # 阶段一：初始资源利用（1-9）
      # ===============================================
      lumberjack:
        name: '&a要致富，先撸树'
        description: 采集16个橡木原木并种植树苗
        type: onPlayer
        requiredItems:
        - minecraft:oak_log:16;+4
        displayItem: minecraft:oak_log
        lockedDisplayItem: green_stained_glass_pane
        resetInHours: 8
        reward:
          text: 六种树苗和苹果
          commands:
          - 'console: give {party} minecraft:birch_sapling 1'
          - 'console: give {party} minecraft:spruce_sapling 1'
          - 'console: give {party} minecraft:jungle_sapling 4'
          - 'console: give {party} minecraft:acacia_sapling 1'
          - 'console: give {party} minecraft:dark_oak_sapling 4'
          - 'console: give {party} minecraft:apple 4'
          currency: 15
          xp: 15
        repeatReward:
          text: 六种树苗和苹果
          commands:
          - 'console: give {party} minecraft:birch_sapling 1'
          - 'console: give {party} minecraft:spruce_sapling 1'
          - 'console: give {party} minecraft:jungle_sapling 4'
          - 'console: give {party} minecraft:acacia_sapling 1'
          - 'console: give {party} minecraft:dark_oak_sapling 4'
          - 'console: give {party} minecraft:apple 2'
          currency: 5
          xp: 5

      cobble_gen:
        name: '&7刷石机'
        description: 利用冰和岩浆制作刷石机，采集64个圆石
        type: onPlayer
        requiredItems:
        - minecraft:cobblestone:64;+8
        displayItem: minecraft:cobblestone
        lockedDisplayItem: gray_stained_glass_pane
        resetInHours: 12
        reward:
          text: 8个泥土，4个砂砾
          commands:
          - 'console: give {party} minecraft:dirt 8'
          - 'console: give {party} minecraft:gravel 4'
          currency: 10
          xp: 10
        repeatReward:
          text: 4个泥土
          commands:
          - 'console: give {party} minecraft:dirt 4'
          currency: 5
          xp: 5

      sugar_cane_plant:
        name: '&a甘蔗种植'
        description: 在岛屿上种植甘蔗（至少4个）
        type: onIsland
        radius: 10
        requiredBlocks:
        - minecraft:sugar_cane:4
        displayItem: minecraft:sugar_cane
        lockedDisplayItem: green_stained_glass_pane
        resetInHours: 6
        reward:
          text: 4个沙子，4个泥土，1个海带
          commands:
          - 'console: give {party} minecraft:sand 4'
          - 'console: give {party} minecraft:dirt 4'
          - 'console: give {party} minecraft:kelp 1'
          currency: 15
          xp: 15

      cactus_plant:
        name: '&a仙人掌种植'
        description: 在岛屿上种植仙人掌（至少4个）
        type: onIsland
        radius: 10
        requiredBlocks:
        - minecraft:cactus:4
        displayItem: minecraft:cactus
        lockedDisplayItem: green_stained_glass_pane
        resetInHours: 6
        reward:
          text: 4个沙子，4个泥土
          commands:
          - 'console: give {party} minecraft:sand 4'
          - 'console: give {party} minecraft:dirt 4'
          currency: 15
          xp: 15

      melon_farm:
        name: '&a西瓜种植'
        description: 种植西瓜并收获64个西瓜片
        type: onPlayer
        requiredItems:
        - minecraft:melon_slice:64;+8
        displayItem: minecraft:melon_slice
        lockedDisplayItem: lime_stained_glass_pane
        resetInHours: 8
        reward:
          text: 4个泥土，1个西瓜种子，1个鸡刷怪蛋
          commands:
          - 'console: give {party} minecraft:dirt 4'
          - 'console: give {party} minecraft:melon_seeds 1'
          - 'console: give {party} minecraft:chicken_spawn_egg 1'
          currency: 15
          xp: 15
        repeatReward:
          text: 2个泥土，1个鸡刷怪蛋
          commands:
          - 'console: give {party} minecraft:dirt 2'
          - 'console: give {party} minecraft:chicken_spawn_egg 1'
          currency: 5
          xp: 5

      pumpkin_farm:
        name: '&a南瓜种植'
        description: 种植南瓜并收获32个南瓜
        type: onPlayer
        requiredItems:
        - minecraft:pumpkin:32;+4
        displayItem: minecraft:pumpkin
        lockedDisplayItem: orange_stained_glass_pane
        resetInHours: 8
        reward:
          text: 4个泥土，1个南瓜种子
          commands:
          - 'console: give {party} minecraft:dirt 4'
          - 'console: give {party} minecraft:pumpkin_seeds 1'
          currency: 15
          xp: 15
        repeatReward:
          text: 2个泥土
          commands:
          - 'console: give {party} minecraft:dirt 2'
          currency: 5
          xp: 5

      sugar_cane_harvest:
        name: '&a甘蔗收获'
        description: 收获64个甘蔗
        type: onPlayer
        requiredChallenges:
        - sugar_cane_plant
        requiredItems:
        - minecraft:sugar_cane:64;+8
        displayItem: minecraft:sugar_cane
        lockedDisplayItem: green_stained_glass_pane
        resetInHours: 8
        reward:
          text: 4个泥土，1本书，1个竹子
          commands:
          - 'console: give {party} minecraft:dirt 4'
          - 'console: give {party} minecraft:book 1'
          - 'console: give {party} minecraft:bamboo 1'
          currency: 15
          xp: 15
        repeatReward:
          text: 4个泥土，1个纸
          commands:
          - 'console: give {party} minecraft:dirt 4'
          - 'console: give {party} minecraft:paper 1'
          currency: 5
          xp: 5

      cactus_harvest:
        name: '&a仙人掌收获'
        description: 收获32个仙人掌
        type: onPlayer
        requiredChallenges:
        - cactus_plant
        requiredItems:
        - minecraft:cactus:32;+4
        displayItem: minecraft:cactus
        lockedDisplayItem: green_stained_glass_pane
        resetInHours: 8
        reward:
          text: 8个沙子，4个绿色染料
          commands:
          - 'console: give {party} minecraft:sand 8'
          - 'console: give {party} minecraft:green_dye 4'
