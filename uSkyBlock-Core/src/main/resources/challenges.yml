        requiredItems:
        - minecraft:mycelium:16
        - minecraft:podzol:8
        - minecraft:red_mushroom:16
        - minecraft:brown_mushroom:16
        displayItem: minecraft:mycelium
        lockedDisplayItem: brown_stained_glass_pane
        resetInHours: 0
        repeatable: false
        reward:
          text: 解锁蘑菇岛生物群系，获得哞菇刷怪蛋
          commands:
          - 'console: give {party} minecraft:mooshroom_spawn_egg 1'
          - 'console: give {party} minecraft:mushroom_stew 8'
