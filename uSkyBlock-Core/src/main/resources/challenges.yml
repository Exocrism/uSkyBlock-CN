# ======================================================================================================================
#
# 以下是挑战组和挑战设置的格式与说明单注释 (#) 是最常用的设置，双注释 (##) 是可选设置，如果你喜欢使用这些设置的话
#
# 物品类型格式
# 物品类型定义方式与 Minecraft /give 命令相同，即使用它们的 Minecraft 键以及可能的组件，放入方括号中
# 例如，'minecraft:diamond_sword[damage=42]'请参阅 Minecraft Wiki 了解更多信息：
# https://minecraft.wiki/w/Data_component_format你也可以使用命令 '/usb iteminfo' 来获取信息
#
# 此物品类型根据使用位置的不同，会补充额外的信息：
#
# display-item: <类型>
# 要在 GUI 中显示的物品它仅定义如上所述的物品类型，不带任何额外信息
# 例如：'cobblestone', 'minecraft:stone', 'diamond_sword[damage=42]'
#
# item-requirement: <类型>:<数量>[;+<增量>]
# 挑战的物品需求数量是所需的物品数量可选的 +<数量> 是每次重复挑战时所需物品增加的数量
# 例如，'cobblestone:64;+16' 第一次完成需要 64 个圆石，第二次完成需要 80 个圆石其他选项是
# -、* 和 /，分别用于减法、乘法和除法例如，'cobblestone:64;*2' 第一次完成
# 需要 64 个圆石，第二次完成需要 128 个圆石，第三次完成需要 256 个圆石
#
# item-reward: [{p=<概率>}]<类型>:<数量>
# 挑战的物品奖励数量是要给予的物品数量可选的 {p=<概率>} 是
# 给予该物品的概率例如，'cobblestone:64' 每次完成挑战都会给予 64 个圆石，
# 而 '{p=0.1}cobblestone:64' 有 10% 的概率给予 64 个圆石
#
# ======================================================================================================================
# 所有挑战都在 ranks 部分中定义每个 rank 是玩家可以完成的一层挑战
#
# ranks:
#  # [文本] 挑战等级的名称
#  TierX:
#    # [文本] 执行 /challenges 时显示的挑战等级名称（支持大写和颜色代码）
#    name: '&a自定义挑战等级名称'
#    # [display-item] 在挑战菜单中为已完成挑战显示的物品
#    displayItem: 'cyan_terracotta'
#    # [整数] 需求物品重置为默认值之前的时间（小时）（这将覆盖主要的重置时间）
#    resetInHours: 20
#    # 这些需求控制挑战组何时对玩家可用
#    requires:
#      # [整数] 每个等级可以未完成但能晋级到下一个等级的挑战数量例如，
#                 如果你有 4 个挑战且 rankLeeway 为 1，玩家只需完成 3 个即可晋级到
#                 下一个等级rankLeeway 为 0 则要求全部完成
#      rankLeeway: 8
#      # [列表[文本]] 必须完成才能解锁此挑战组的挑战
#      challenges:
#      - 某个挑战名称
# ======================================================================================================================
#    challenges:
#      # [文本] 挑战名称所有挑战名称应为小写
#      defaultchallenge:
#      # [文本] 在 /challenges 中显示的挑战名称（支持大写和颜色代码）
#        name: '&a 默认挑战'
#        # [文本] 玩家执行 /challenges <挑战名> 时看到的描述
#        description:
#        # [onIsland/onPlayer/islandLevel] 定义所需方块/物品应在玩家的背包中
#        # 还是在他们的岛屿上使用 onIsland 时，玩家必须在他岛屿上距离所需方块
#        # 10 格范围内使用 islandLevel 时，'requiredItems' 字段应为所需的岛屿等级
#        # 玩家必须先使用 /island level 来更新他们的等级
#        type: onPlayer
#        ## type: islandLevel
#        ## type: onIsland
#        # [整数] 覆盖使用 onIsland 时默认的 10 格半径
#        ## radius: 20
#        # 列表[物品需求] 完成挑战所需的物品
#        requiredItems:
#        - stone:64;+16
#        - cobblestone:64;+16
#        # 列表[方块需求] 完成挑战所需的方块
#        requiredBlocks:
#        - stone:64
#        - cobblestone:64
#        # [true/false] 挑战是否可以重复
#        ## repeatable: true
#        # [整数] 挑战可以完成的最大次数覆盖默认的 repeatLimit
#        #           值为 0 表示无限重复
#        ## repeatLimit: 5
#        # [display-item] 在挑战菜单中为已完成挑战显示的物品
#        displayItem: cobblestone
#        # [整数] 需求物品重置为默认值之前的时间（小时）（覆盖主要和等级默认值）
#        ## resetInHours: 4
#        # [true/false] 完成挑战时取走所需物品
#        ## takeItems: true
#        # 玩家完成挑战获得的奖励
#        reward:
#          # [文本] 奖励描述
#          text: '苔石和一把耐久 1 的铁镐'
#          # [列表[物品奖励]] 完成挑战时给予玩家的物品列表
#          items:
#          - mossy_cobblestone:16
#          - iron_pickaxe[enchantments={levels:{unbreaking:1}}]:1
#          # [权限节点] 完成时授予的权限多个权限用空格分隔
#          ## permission: 'test.permission'
#          # [整数] 完成时给予多少货币（需要经济插件）
#          ## currency: 0
#          # [整数] 完成时给予玩家多少经验
#          ## xp: 0
#          # [列表[文本]] 完成时执行给定的命令前面加上 "op" 或 "console" 以以 OP 身份
#                        或从控制台运行命令示例：
#          # 可能的命令参数有：
#          # {player}     - 玩家名称
#          # {playerName} - 玩家的显示名称
#          # {challenge}  - 挑战名称
#          # {position}   - 玩家的位置
#          # {party}      - 为队伍中的每个成员执行一次命令（替换名称）
#          ## commands:
#          ## - 'op: me are the GOD of things'
#          ## - 'console: give {party} aweseomestuff 32'
#        # 奖励部分，用于奖励玩家完成重复挑战（第一次之后的任何一次）
#        # 结构与 'reward' 部分相同
#        repeatReward:
#          text: '苔石'
#          items:
#          - mossy_cobblestone:16
#
# ======================================================================================================================

# ======================================================================================================================
allowChallenges: true
challengeSharing: island
broadcastCompletion: true
broadcastText: '&6'
requirePreviousRank: true
rankLeeway: 8
defaultResetInHours: 20
radius: 10
repeatLimit: 0
challengeColor: '&e'
finishedColor: '&2'
repeatableColor: '&a'
enableEconomyPlugin: true
resetChallengesOnCreate: true
lockedDisplayItem: red_stained_glass_pane
ISLAND:
  lockedDisplayItem: blue_stained_glass_pane
ISLAND_LEVEL:
  lockedDisplayItem: black_stained_glass_pane
showLockedChallengeName: true

ranks:
  # ===============================================
  # 第一层：拓荒时代 - 从零开始到下界之门 (1.21.4)
  # 初始资源：橡树、2冰、1岩浆桶、西瓜种子、南瓜种子、红蘑菇、棕蘑菇、甘蔗、约60泥土、3沙子
  # ===============================================
  Tier1:
    name: '&a拓荒时代'
    displayItem: minecraft:grass_block
    resetInHours: 20
    challenges:
      # ===============================================
      # 阶段一：初始资源利用（1-9）
      # ===============================================
      lumberjack:
        name: '&a要致富，先撸树'
        description: 采集16个橡木原木并种植树苗
        type: onPlayer
        requiredItems:
        - minecraft:oak_log:16;+4
        displayItem: minecraft:oak_log
        lockedDisplayItem: green_stained_glass_pane
        resetInHours: 8
        reward:
          text: 六种树苗和苹果
          commands:
          - 'console: give {party} minecraft:birch_sapling 1'
          - 'console: give {party} minecraft:spruce_sapling 1'
          - 'console: give {party} minecraft:jungle_sapling 4'
          - 'console: give {party} minecraft:acacia_sapling 1'
          - 'console: give {party} minecraft:dark_oak_sapling 4'
          - 'console: give {party} minecraft:apple 4'
          currency: 15
          xp: 15
        repeatReward:
          text: 六种树苗和苹果
          commands:
          - 'console: give {party} minecraft:birch_sapling 1'
          - 'console: give {party} minecraft:spruce_sapling 1'
          - 'console: give {party} minecraft:jungle_sapling 4'
          - 'console: give {party} minecraft:acacia_sapling 1'
          - 'console: give {party} minecraft:dark_oak_sapling 4'
          - 'console: give {party} minecraft:apple 2'
          currency: 5
          xp: 5

      cobble_gen:
        name: '&7刷石机'
        description: 利用冰和岩浆制作刷石机，采集64个圆石
        type: onPlayer
        requiredItems:
        - minecraft:cobblestone:64;+8
        displayItem: minecraft:cobblestone
        lockedDisplayItem: gray_stained_glass_pane
        resetInHours: 12
        reward:
          text: 8个泥土，4个砂砾
          commands:
          - 'console: give {party} minecraft:dirt 8'
          - 'console: give {party} minecraft:gravel 4'
          currency: 10
          xp: 10
        repeatReward:
          text: 4个泥土
          commands:
          - 'console: give {party} minecraft:dirt 4'
          currency: 5
          xp: 5

      sugar_cane_plant:
        name: '&a甘蔗种植'
        description: 在岛屿上种植甘蔗（至少4个）
        type: onIsland
        radius: 10
        requiredBlocks:
        - minecraft:sugar_cane:4
        displayItem: minecraft:sugar_cane
        lockedDisplayItem: green_stained_glass_pane
        resetInHours: 6
        reward:
          text: 4个沙子，4个泥土，1个海带
          commands:
          - 'console: give {party} minecraft:sand 4'
          - 'console: give {party} minecraft:dirt 4'
          - 'console: give {party} minecraft:kelp 1'
          currency: 15
          xp: 15

      cactus_plant:
        name: '&a仙人掌种植'
        description: 在岛屿上种植仙人掌（至少4个）
        type: onIsland
        radius: 10
        requiredBlocks:
        - minecraft:cactus:4
        displayItem: minecraft:cactus
        lockedDisplayItem: green_stained_glass_pane
        resetInHours: 6
        reward:
          text: 4个沙子，4个泥土
          commands:
          - 'console: give {party} minecraft:sand 4'
          - 'console: give {party} minecraft:dirt 4'
          currency: 15
          xp: 15

      melon_farm:
        name: '&a西瓜种植'
        description: 种植西瓜并收获64个西瓜片
        type: onPlayer
        requiredItems:
        - minecraft:melon_slice:64;+8
        displayItem: minecraft:melon_slice
        lockedDisplayItem: lime_stained_glass_pane
        resetInHours: 8
        reward:
          text: 4个泥土，1个西瓜种子，1个鸡刷怪蛋
          commands:
          - 'console: give {party} minecraft:dirt 4'
          - 'console: give {party} minecraft:melon_seeds 1'
          - 'console: give {party} minecraft:chicken_spawn_egg 1'
          currency: 15
          xp: 15
        repeatReward:
          text: 2个泥土，1个鸡刷怪蛋
          commands:
          - 'console: give {party} minecraft:dirt 2'
          - 'console: give {party} minecraft:chicken_spawn_egg 1'
          currency: 5
          xp: 5

      pumpkin_farm:
        name: '&a南瓜种植'
        description: 种植南瓜并收获32个南瓜
        type: onPlayer
        requiredItems:
        - minecraft:pumpkin:32;+4
        displayItem: minecraft:pumpkin
        lockedDisplayItem: orange_stained_glass_pane
        resetInHours: 8
        reward:
          text: 4个泥土，1个南瓜种子
          commands:
          - 'console: give {party} minecraft:dirt 4'
          - 'console: give {party} minecraft:pumpkin_seeds 1'
          currency: 15
          xp: 15
        repeatReward:
          text: 2个泥土
          commands:
          - 'console: give {party} minecraft:dirt 2'
          currency: 5
          xp: 5

      sugar_cane_harvest:
        name: '&a甘蔗收获'
        description: 收获64个甘蔗
        type: onPlayer
        requiredChallenges:
        - sugar_cane_plant
        requiredItems:
        - minecraft:sugar_cane:64;+8
        displayItem: minecraft:sugar_cane
        lockedDisplayItem: green_stained_glass_pane
        resetInHours: 8
        reward:
          text: 4个泥土，1本书，1个竹子
          commands:
          - 'console: give {party} minecraft:dirt 4'
          - 'console: give {party} minecraft:book 1'
          - 'console: give {party} minecraft:bamboo 1'
          currency: 15
          xp: 15
        repeatReward:
          text: 4个泥土，1个纸
          commands:
          - 'console: give {party} minecraft:dirt 4'
          - 'console: give {party} minecraft:paper 1'
          currency: 5
          xp: 5

      cactus_harvest:
        name: '&a仙人掌收获'
        description: 收获32个仙人掌
        type: onPlayer
        requiredChallenges:
        - cactus_plant
        requiredItems:
        - minecraft:cactus:32;+4
        displayItem: minecraft:cactus
        lockedDisplayItem: green_stained_glass_pane
        resetInHours: 8
        reward:
          text: 8个沙子，4个绿色染料
          commands:
          - 'console: give {party} minecraft:sand 8'
          - 'console: give {party} minecraft:green_dye 4'
          currency: 15
          xp: 15
        repeatReward:
          text: 4个沙子，2个绿色染料
          commands:
          - 'console: give {party} minecraft:sand 4'
          - 'console: give {party} minecraft:green_dye 2'
          currency: 5
          xp: 5

      mushroom_farm:
        name: '&a蘑菇农场'
        description: 在阴暗处种植并收获蘑菇各32个
        type: onPlayer
        requiredItems:
        - minecraft:red_mushroom:32;+4
        - minecraft:brown_mushroom:32;+4
        displayItem: minecraft:red_mushroom
        lockedDisplayItem: brown_stained_glass_pane
        resetInHours: 10
        reward:
          text: 4个菌丝，4个灰化土，1个牛刷怪蛋
          commands:
          - 'console: give {party} minecraft:mycelium 4'
          - 'console: give {party} minecraft:podzol 4'
          - 'console: give {party} minecraft:cow_spawn_egg 1'
          currency: 20
          xp: 20
        repeatReward:
          text: 2个菌丝，1个牛刷怪蛋
          commands:
          - 'console: give {party} minecraft:mycelium 2'
          - 'console: give {party} minecraft:cow_spawn_egg 1'
          currency: 10
          xp: 10

      # ===============================================
      # 阶段二：石器与基础工具（10-15）
      # ===============================================
      stone_tools:
        name: '&7石器时代'
        description: 制作一套完整的石质工具
        type: onPlayer
        requiredChallenges:
        - cobble_gen
        - lumberjack
        requiredItems:
        - minecraft:stone_pickaxe:1
        - minecraft:stone_axe:1
        - minecraft:stone_shovel:1
        - minecraft:stone_hoe:1
        - minecraft:stone_sword:1
        displayItem: minecraft:stone_pickaxe
        lockedDisplayItem: gray_stained_glass_pane
        resetInHours: 0
        repeatable: false
        takeItems: true
        reward:
          text: 8个圆石，4个煤炭，为你的工具附魔
          commands:
          - 'console: give {party} minecraft:cobblestone 8'
          - 'console: give {party} minecraft:coal 4'
          - 'console: give {party} minecraft:stone_pickaxe 1 [enchantments={levels:{efficiency:1,unbreaking:1}}]'
          - 'console: give {party} minecraft:stone_axe 1 [enchantments={levels:{efficiency:1,unbreaking:1}}]'
          - 'console: give {party} minecraft:stone_shovel 1 [enchantments={levels:{efficiency:1,unbreaking:1}}]'
          - 'console: give {party} minecraft:stone_hoe 1 [enchantments={levels:{efficiency:1,unbreaking:1}}]'
          - 'console: give {party} minecraft:stone_sword 1 [enchantments={levels:{sharpness:1,unbreaking:1}}]'
          currency: 20
          xp: 20

      furnace_basics:
        name: '&7冶炼入门'
        description: 制作熔炉，烧制木炭和石头
        type: onPlayer
        requiredChallenges:
        - stone_tools
        requiredItems:
        - minecraft:furnace:1
        - minecraft:charcoal:8
        - minecraft:stone:16
        displayItem: minecraft:furnace
        lockedDisplayItem: gray_stained_glass_pane
        resetInHours: 24
        reward:
          text: 4个粗铁，4个煤炭，1个猪刷怪蛋
          commands:
          - 'console: give {party} minecraft:raw_iron 4'
          - 'console: give {party} minecraft:coal 4'
          - 'console: give {party} minecraft:pig_spawn_egg 1'
          currency: 20
          xp: 20

      workstation:
        name: '&7工作站'
        description: 建造带有工作台、熔炉和箱子的工作区
        type: onIsland
        radius: 15
        requiredChallenges:
        - lumberjack
        requiredBlocks:
        - minecraft:crafting_table:1
        - minecraft:torch:1
        - minecraft:furnace:3
        - minecraft:chest:2
        displayItem: minecraft:crafting_table
        lockedDisplayItem: brown_stained_glass_pane
        resetInHours: 24
        reward:
          text: 4个粗铁，2个粗金，1个钻石
          commands:
          - 'console: give {party} minecraft:raw_iron 4'
          - 'console: give {party} minecraft:raw_gold 2'
          - 'console: give {party} minecraft:diamond 1'
          currency: 15
          xp: 15

      torch_master:
        name: '&e火把神'
        description: 制作64个火把照亮岛屿
        type: onPlayer
        requiredChallenges:
        - furnace_basics
        requiredItems:
        - minecraft:torch:64;+8
        displayItem: minecraft:torch
        lockedDisplayItem: yellow_stained_glass_pane
        resetInHours: 10
        reward:
          text: 8个煤炭，4个粗铁
          commands:
          - 'console: give {party} minecraft:coal 8'
          - 'console: give {party} minecraft:raw_iron 4'
          currency: 15
          xp: 15
        repeatReward:
          text: 4个煤炭
          commands:
          - 'console: give {party} minecraft:coal 4'
          currency: 5
          xp: 5

      composter:
        name: '&a堆肥'
        description: 制作堆肥桶并获取16个骨粉
        type: onPlayer
        requiredChallenges:
        - workstation
        requiredItems:
        - minecraft:composter:1
        - minecraft:bone_meal:16
        displayItem: minecraft:composter
        lockedDisplayItem: brown_stained_glass_pane
        resetInHours: 24
        reward:
          text: 8个骨粉，4个泥土
          commands:
          - 'console: give {party} minecraft:bone_meal 8'
          - 'console: give {party} minecraft:dirt 4'
          currency: 15
          xp: 15

      wheat_farm:
        name: '&a小麦种植'
        description: 收获64个小麦
        type: onPlayer
        requiredChallenges:
        - composter
        requiredItems:
        - minecraft:wheat:64;+8
        displayItem: minecraft:wheat
        lockedDisplayItem: yellow_stained_glass_pane
        resetInHours: 8
        reward:
          text: 4个泥土，4个面包，2个小麦种子
          commands:
          - 'console: give {party} minecraft:dirt 4'
          - 'console: give {party} minecraft:bread 4'
          - 'console: give {party} minecraft:wheat_seeds 2'
          currency: 15
          xp: 15
        repeatReward:
          text: 2个泥土，1个小麦种子
          commands:
          - 'console: give {party} minecraft:dirt 2'
          - 'console: give {party} minecraft:wheat_seeds 1'
          currency: 5
          xp: 5

      # ===============================================
      # 阶段三：刷怪与怪物资源（16-21）
      # ===============================================
      monster_hunter:
        name: '&5怪物猎人'
        description: 收集多种怪物掉落物
        type: onPlayer
        requiredChallenges:
        - torch_master
        requiredItems:
        - minecraft:rotten_flesh:32;+4
        - minecraft:bone:32;+4
        - minecraft:string:32;+4
        - minecraft:gunpowder:8;+2
        - minecraft:spider_eye:4;+1
        displayItem: minecraft:rotten_flesh
        lockedDisplayItem: purple_stained_glass_pane
        resetInHours: 10
        reward:
          text: 8个粗铁，4个土豆，8个红石粉，4个燧石，16支箭
          commands:
          - 'console: give {party} minecraft:raw_iron 8'
          - 'console: give {party} minecraft:potato 4'
          - 'console: give {party} minecraft:redstone 8'
          - 'console: give {party} minecraft:flint 4'
          - 'console: give {party} minecraft:arrow 16'
          currency: 30
          xp: 30
        repeatReward:
          text: 2个粗铁
          commands:
          - 'console: give {party} minecraft:raw_iron 2'
          currency: 10
          xp: 10

      zombie_hunter:
        name: '&5僵尸猎人'
        description: 收集64个腐肉
        type: onPlayer
        requiredChallenges:
        - monster_hunter
        requiredItems:
        - minecraft:rotten_flesh:64;+4
        displayItem: minecraft:rotten_flesh
        lockedDisplayItem: purple_stained_glass_pane
        resetInHours: 10
        reward:
          text: 4个粗铁，2个胡萝卜
          commands:
          - 'console: give {party} minecraft:raw_iron 4'
          - 'console: give {party} minecraft:carrot 2'
          currency: 15
          xp: 15
        repeatReward:
          text: 1个粗铁
          commands:
          - 'console: give {party} minecraft:raw_iron 1'
          currency: 5
          xp: 5

      skeleton_archer:
        name: '&5骷髅射手'
