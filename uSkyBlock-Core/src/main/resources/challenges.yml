        - minecraft:stone_axe:1
        - minecraft:stone_shovel:1
        - minecraft:stone_hoe:1
        - minecraft:stone_sword:1
        displayItem: minecraft:stone_pickaxe
        lockedDisplayItem: gray_stained_glass_pane
        resetInHours: 0
        repeatable: false
        takeItems: true
        reward:
          text: 8个圆石，4个煤炭，为你的工具附魔
          commands:
          - 'console: give {party} minecraft:cobblestone 8'
          - 'console: give {party} minecraft:coal 4'
          - 'console: give {party} minecraft:stone_pickaxe 1 [enchantments={levels:{efficiency:1,unbreaking:1}}]'
          - 'console: give {party} minecraft:stone_axe 1 [enchantments={levels:{efficiency:1,unbreaking:1}}]'
          - 'console: give {party} minecraft:stone_shovel 1 [enchantments={levels:{efficiency:1,unbreaking:1}}]'
          - 'console: give {party} minecraft:stone_hoe 1 [enchantments={levels:{efficiency:1,unbreaking:1}}]'
          - 'console: give {party} minecraft:stone_sword 1 [enchantments={levels:{sharpness:1,unbreaking:1}}]'
