biomes:
  ocean:
    displayItem: tropical_fish
    name: 海洋
    description: |
      海洋是所有岛屿的默认起始生物群系。
      被动生物如动物不会生成。
      敌对生物正常生成。

  forest:
    displayItem: spruce_sapling
    name: 森林
    description: |
      森林生物群系允许你的岛屿生成
      被动生物如动物（包括狼）。
      敌对生物正常生成。

  desert:
    displayItem: sand
    name: 沙漠
    description: |
      沙漠生物群系不会下雨或下雪。
      被动生物不会生成。
      敌对生物正常生成。

  jungle:
    displayItem: jungle_sapling
    name: 丛林
    description: |
      丛林生物群系明亮多彩。
      被动生物（包括豹猫）会生成。
      敌对生物正常生成。

  swamp:
    displayItem: lily_pad
    name: 沼泽
    description: |
      沼泽生物群系阴暗沉闷。
      被动生物正常生成，
      史莱姆在夜晚有小概率根据月相生成。

  taiga:
    displayItem: snow
    name: 针叶林
    description: |
      针叶林生物群系下雪而不是下雨。
      被动生物正常生成（包括狼），
      敌对生物正常生成。

  mushroom_fields:
    displayItem: red_mushroom
    name: 蘑菇岛
    description: |
      蘑菇岛生物群系明亮多彩。
      只有哞菇会生成。
      不会生成其他被动或敌对生物。

  nether_wastes:
    displayItem: nether_brick
    name: 下界荒地
    description: |
      下界荒地看起来黑暗而荒芜。
      一些下界生物会在此生成
      （不包括恶魂和烈焰人）。

  the_end:
    displayItem: ender_eye
    name: 末地
    description: |
      末地生物群系有特殊的黑暗天空。
      只有末影人会在此生成。

  plains:
    displayItem: tall_grass
    name: 平原
    description: |
      平原生物群系下雨而不是下雪。
      被动生物正常生成（包括马），
      敌对生物正常生成。

  windswept_hills:
    displayItem: emerald_ore
    name: 风袭丘陵
    description: |
      风袭丘陵生物群系。
      被动生物正常生成，
      敌对生物正常生成。

  flower_forest:
    displayItem: rose_bush
    name: 繁花森林
    description: |
      繁花森林生物群系。
      被动生物正常生成，
      敌对生物正常生成。

  savanna_plateau:
    displayItem: acacia_sapling
    name: 热带高原
    description: |
      热带高原生物群系。被动生物
      正常生成，包括羊驼、马和驴。
      敌对生物正常生成。

  lush_caves:
    displayItem: glow_berries
    name: 繁茂洞穴
    description: |
      繁茂洞穴生物群系。被动生物
      正常生成，包括美西螈和热带鱼。
      敌对生物正常生成。

  lukewarm_ocean:
    displayItem: tropical_fish
    name: 温水海洋
    description: |
      温水海洋是高级生物群系。
      生成包括鳕鱼、鱿鱼、海豚、
      河豚和热带鱼。

  snowy_slopes:
    displayItem: goat_horn
    name: 雪坡
    description: |
      雪坡生物群系。被动生物包括
      兔子和山羊。敌对生物正常生成。

  deep_ocean:
    displayItem: prismarine_shard
    name: 深海
    description: |
      深海是高级生物群系。
      被动生物如动物不会生成。
      敌对生物（包括守卫者）正常生成。

  snowy_plains:
    displayItem: snow_block
    name: 积雪平原
    description: |
      积雪平原是高级生物群系。
      除兔子和北极熊外不会生成被动生物。
      流髑可在夜晚生成。

version: 1
